name: Atualizar catalogo de KBs do Tanium

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/update-tanium-kb-catalog.yml"

permissions:
  contents: write

concurrency:
  group: tanium-kb-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar sincronizador e gerador
        run: npm run test:tanium
      - name: Consultar o catalogo oficial da Microsoft
        id: sync
        run: node scripts/update-tanium-kb-catalog.mjs
      - name: Publicar somente quando houver mudanca
        if: ${{ always() && (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure') }}
        run: |
          test -s tanium_kb_catalog.json
          test -s tanium_kb_catalog.v2.json
          if git diff --quiet -- tanium_kb_catalog.json tanium_kb_catalog.v2.json; then
            echo "Catalogo ja esta atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tanium_kb_catalog.json tanium_kb_catalog.v2.json
          git commit -m "Sincronizar KBs de seguranca e status das fontes Microsoft"
          git pull --rebase origin main
          git push
