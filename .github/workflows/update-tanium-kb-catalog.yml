name: Atualizar catalogo de KBs do Tanium

on:
  schedule:
    - cron: "17 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar o catalogo oficial da Microsoft
        run: node scripts/update-tanium-kb-catalog.mjs
      - name: Publicar somente quando houver mudanca
        run: |
          if git diff --quiet -- tanium_kb_catalog.json; then
            echo "Catalogo ja esta atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tanium_kb_catalog.json
          git commit -m "Atualizar catalogo mensal de KBs do Tanium"
          git push
